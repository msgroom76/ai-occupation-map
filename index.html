<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}</style>
<meta name="description" content="사람이 하던 일, AI가 어디까지 들어왔나. 한국 취업자 2,904만 명의 일을 지도로 그리고, AI 소식을 하루 세 번 반영합니다.">
<meta property="og:type" content="website"><meta property="og:title" content="AI 점령지도"><meta property="og:description" content="내 직업, AI가 이미 몇 %를 해낼 수 있을까? 한국 직업 56개 지역의 AI 노출도 지도.">
<meta property="og:image" content="og.png"><meta name="twitter:card" content="summary_large_image"><meta name="theme-color" content="#0b0b0f">
<title>AI 점령지도</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 지도가 화면 전체(Maps 방식). 데스크톱은 왼쪽 떠 있는 패널, 휴대폰은 아래에서 끌어올리는 시트. 숫자는 문장 먼저, 숫자 다음, 근거는 마지막 */
:root{
  --bg:#0B0C10; --map-bg:#0B0C10; --map-park:#17241F;
  --ink:#F5F5F7; --ink2:rgba(235,235,245,.64); --ink3:rgba(235,235,245,.38);
  --fill:rgba(118,118,128,.18); --fill2:rgba(118,118,128,.28); --sep:rgba(84,84,88,.55);
  --glass:rgba(28,28,30,.74); --glass-solid:#1C1C1E; --glass-edge:rgba(255,255,255,.08);
  --tint:#0A84FF; --hot:#FF8CCD; --hot-ink:#FF8CCD; --warn:#FF9F0A;
  --label-bg:rgba(242,242,247,.94); --label-ink:#0B0C10; --label-ink2:#48484A;
  --shadow:0 10px 40px rgba(0,0,0,.5);
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --f-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --r-panel:18px; --r-card:14px; --r-ctl:12px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#F2F2F7; --map-bg:#ECECF1; --map-park:#D5E6D8;
  --ink:#1C1C1E; --ink2:rgba(60,60,67,.66); --ink3:rgba(60,60,67,.38);
  --fill:rgba(120,120,128,.12); --fill2:rgba(120,120,128,.2); --sep:rgba(60,60,67,.18);
  --glass:rgba(255,255,255,.78); --glass-solid:#FFFFFF; --glass-edge:rgba(0,0,0,.06);
  --tint:#007AFF; --hot:#B5297B; --hot-ink:#A3206F; --warn:#C25E00;
  --label-bg:rgba(28,28,30,.9); --label-ink:#FFFFFF; --label-ink2:#C7C7CC;
  --shadow:0 10px 40px rgba(0,0,0,.14); color-scheme:light}}
:root[data-theme="light"]{
  --bg:#F2F2F7; --map-bg:#ECECF1; --map-park:#D5E6D8;
  --ink:#1C1C1E; --ink2:rgba(60,60,67,.66); --ink3:rgba(60,60,67,.38);
  --fill:rgba(120,120,128,.12); --fill2:rgba(120,120,128,.2); --sep:rgba(60,60,67,.18);
  --glass:rgba(255,255,255,.78); --glass-solid:#FFFFFF; --glass-edge:rgba(0,0,0,.06);
  --tint:#007AFF; --hot:#B5297B; --hot-ink:#A3206F; --warn:#C25E00;
  --label-bg:rgba(28,28,30,.9); --label-ink:#FFFFFF; --label-ink2:#C7C7CC;
  --shadow:0 10px 40px rgba(0,0,0,.14); color-scheme:light}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.45;margin:0;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--tint);outline-offset:2px}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(28px) saturate(1.7);backdrop-filter:blur(28px) saturate(1.7);border:.5px solid var(--glass-edge);box-shadow:var(--shadow)}

/* 지도 */
.stage{position:fixed;inset:0;background:var(--map-bg)}
.vp{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:crosshair}
.vp.zoomed{cursor:grab}
.stack{position:absolute;left:0;top:0;width:1800px;height:2400px;transform-origin:0 0}
.stack>*{position:absolute;inset:0;width:1800px;height:2400px;display:block}
#roads{pointer-events:none;user-select:none;opacity:.7}
.lightmap #roads{filter:invert(1);opacity:.42}
.lightmap #jb,.lightmap #grp{filter:invert(1)}
.lightmap #tb{filter:invert(1);opacity:.7}
.lbls{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;left:0;top:0;display:flex;align-items:center;gap:5px;white-space:nowrap;line-height:1}
.lb.off{visibility:hidden}
.lb.job{background:var(--label-bg);color:var(--label-ink);padding:5px 8px 5px 6px;border-radius:7px;font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.lb.job i{display:block;width:8px;height:8px;border-radius:50%;flex:none}
.lb.job .v{font-weight:500;font-size:.88em;color:var(--label-ink2)}
.lb.job.dim{opacity:.45}
.lb.job.a{outline:2.5px solid var(--ink);outline-offset:2px}
.lb.job.b{outline:2.5px dashed var(--ink);outline-offset:2px}
.lb.cat{color:var(--ink);font-family:var(--f-display);font-weight:400;letter-spacing:-.01em;font-size:20px;gap:8px;padding:7px 13px 8px;border-radius:10px;background:color-mix(in srgb,var(--map-bg) 86%,transparent);border:1px solid color-mix(in srgb,var(--ink) 22%,transparent);box-shadow:0 2px 10px rgba(0,0,0,.35)}
.lb.cat .v{letter-spacing:0;font-weight:500;font-size:.78em;color:var(--hot-ink)}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink2)}

/* 지도 위 컨트롤 */
.ctl{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:calc(16px + env(safe-area-inset-top,0px));display:grid;gap:10px;z-index:6}
.ctl .grp{display:grid;border-radius:var(--r-ctl);overflow:hidden}
.ctl button{all:unset;cursor:pointer;width:44px;height:44px;display:grid;place-items:center;color:var(--ink)}
.ctl .grp button+button{border-top:.5px solid var(--sep)}
.ctl button:hover{background:var(--fill)}
.ctl button:focus-visible{outline:3px solid var(--tint);outline-offset:-3px}
.ctl svg{width:20px;height:20px}
.legend{position:absolute;z-index:5;border-radius:var(--r-ctl);padding:10px 12px 9px;display:grid;gap:5px;width:200px;box-sizing:border-box;font-size:12px}
.legend b{font-size:13px;font-weight:600}
.legend .ramp{display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.legend .ramp i{display:block;height:8px}
.legend .ramp i:first-child{border-radius:4px 0 0 4px}.legend .ramp i:last-child{border-radius:0 4px 4px 0}
.legend .ticks{display:flex;justify-content:space-between;color:var(--ink2);font-size:11px}
.legend .row{display:flex;align-items:center;gap:8px;color:var(--ink2)}
.legend .row i{width:10px;height:10px;border-radius:3px;display:block}
.legend .row b{margin-left:auto;font-weight:500;color:var(--ink);font-size:12px}
.legend .wm{color:var(--ink3);font-size:10.5px;border-top:.5px solid var(--sep);padding-top:5px;margin-top:2px}
.timeline{position:absolute;z-index:5;display:flex;align-items:center;gap:10px;border-radius:999px;padding:6px 16px 6px 6px;box-sizing:border-box}
.timeline .play{all:unset;cursor:pointer;width:36px;height:36px;border-radius:50%;background:var(--fill2);display:grid;place-items:center;flex:none}
.timeline .play svg{width:14px;height:14px}
.timeline .yr{font-weight:600;min-width:84px;font-size:14px}
.timeline .yr small{display:block;font-weight:400;color:var(--ink2);font-size:11px}
.timeline .track{flex:1;min-width:0;display:grid;gap:2px}
.timeline input{width:100%;margin:0;accent-color:var(--ink);height:24px}
.timeline .tk{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink3)}
.tip{position:absolute;pointer-events:none;border-radius:12px;padding:9px 12px;font-size:12.5px;white-space:nowrap;z-index:7;display:grid;gap:2px}
.tip .k{font-family:var(--f-display);font-size:17px;font-weight:700}
.tip .s{color:var(--ink2)}
/* 지도 유형 */
.lyr{position:absolute;z-index:8;right:calc(max(16px,env(safe-area-inset-right,0px)) + 54px);top:calc(16px + env(safe-area-inset-top,0px));width:min(300px,calc(100vw - 100px));box-sizing:border-box;border-radius:var(--r-panel);padding:14px;display:grid;gap:12px}
.lyrh{display:flex;justify-content:space-between;align-items:center}
.lyrh b,.lyrs{font-size:15px;font-weight:600}
.lyrh button{all:unset;cursor:pointer;width:30px;height:30px;display:grid;place-items:center;border-radius:50%;background:var(--fill2);font-size:15px;color:var(--ink2)}
.types,.ovs{display:grid;gap:10px}
.types{grid-template-columns:repeat(3,1fr)}.ovs{grid-template-columns:repeat(3,1fr)}
.types button,.ovs button{all:unset;cursor:pointer;display:grid;justify-items:center;gap:6px;font-size:12px;text-align:center;color:var(--ink2)}
.types button i,.ovs button i{display:block;width:100%;height:48px;border-radius:10px;border:2.5px solid transparent;box-sizing:border-box}
.types button[aria-pressed="true"],.ovs button[aria-pressed="true"]{color:var(--tint);font-weight:600}
.types button[aria-pressed="true"] i,.ovs button[aria-pressed="true"] i{border-color:var(--tint)}
.sw{background:var(--map-bg)}
.sw.jb{background:linear-gradient(135deg,transparent 46%,var(--ink2) 46% 54%,transparent 54%),var(--map-bg)}
.sw.sc{background:linear-gradient(90deg,transparent 46%,var(--ink) 46% 56%,transparent 56%),linear-gradient(0deg,transparent 46%,var(--ink) 46% 56%,transparent 56%),var(--map-bg)}
.sw.tk{background:repeating-linear-gradient(60deg,transparent 0 9px,var(--ink3) 9px 10px),var(--map-bg)}

/* 패널(데스크톱) / 시트(휴대폰) */
.sheet{position:absolute;z-index:6;display:flex;flex-direction:column;overflow:hidden}
.grab{display:none}
.scroll{overflow-y:auto;overscroll-behavior:contain;padding:18px 16px 24px;display:grid;gap:14px;align-content:start}
.head h1{margin:0;font-family:var(--f-display);font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.head p{margin:2px 0 0;color:var(--ink2);font-size:14px}
.badge{display:inline-flex;gap:6px;align-items:center;margin-top:8px;font-size:12px;color:var(--ink2);background:var(--fill);border-radius:999px;padding:3px 10px}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--warn)}
.search{position:relative}
.search input{width:100%;box-sizing:border-box;border:0;border-radius:11px;background:var(--fill2);padding:10px 12px 10px 36px;font-size:16px;color:var(--ink)}
.search input::placeholder{color:var(--ink3)}
.search svg{position:absolute;left:11px;top:21px;transform:translateY(-50%);width:17px;height:17px;color:var(--ink3);pointer-events:none}
.results{list-style:none;margin:6px 0 0;padding:0;border-radius:var(--r-card);background:var(--fill);overflow:hidden}
.results li+li{border-top:.5px solid var(--sep)}
.results button{all:unset;cursor:pointer;box-sizing:border-box;width:100%;display:flex;justify-content:space-between;gap:10px;padding:11px 14px}
.results button:hover{background:var(--fill)}
.results small{color:var(--ink2)}
.sugg{display:flex;flex-wrap:wrap;gap:6px}
.sugg button{all:unset;cursor:pointer;font-size:13px;padding:6px 12px;border-radius:999px;background:var(--fill);color:var(--ink)}
.sugg button:hover{background:var(--fill2)}
.card{background:var(--fill);border-radius:var(--r-card);padding:14px 14px 15px;display:grid;gap:10px}
.card .lab{font-size:12px;font-weight:600;color:var(--ink2);display:flex;justify-content:space-between;align-items:center;gap:8px}
.card .lab .more{all:unset;cursor:pointer;color:var(--tint);font-weight:500;font-size:13px}
.lede{font-family:var(--f-display);font-size:19px;font-weight:600;line-height:1.35;margin:0;text-wrap:balance;word-break:keep-all}
.lede em{font-style:normal;color:var(--hot-ink)}
.bign{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.bign b{font-family:var(--f-display);font-size:48px;font-weight:700;letter-spacing:-.03em;line-height:1}
.bign b small{font-size:24px}
.bign span{color:var(--ink2);font-size:13px}
.chart{display:block;width:100%;height:auto;touch-action:pan-y}
.chart text{font-family:var(--f);font-size:10.5px;fill:var(--ink2)}
.readout{font-size:12.5px;color:var(--ink2);min-height:1.4em}
.readout b{color:var(--ink);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats div{display:grid;gap:1px}
.stats small{font-size:11.5px;color:var(--ink2)}
.stats b{font-size:17px;font-weight:600}
.stats em{font-style:normal;font-size:11px;color:var(--ink3)}
.hl{list-style:none;margin:0;padding:0;display:grid}
.hl li{display:grid;grid-template-columns:22px 1fr;gap:8px;padding:9px 0;font-size:14px;word-break:keep-all}
.hl li+li{border-top:.5px solid var(--sep)}
.hl svg{width:18px;height:18px;color:var(--hot-ink);margin-top:1px}
.cats{display:grid;gap:4px}
.catrow{all:unset;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 10px;padding:8px 0}
.catrow+.catrow{border-top:.5px solid var(--sep)}
.catrow .n{font-weight:600;font-size:14.5px}
.catrow .n small{font-weight:400;color:var(--ink2);font-size:12px;margin-left:6px}
.catrow .v{font-weight:600;font-variant-numeric:tabular-nums}
.meter{grid-column:1/-1;height:6px;border-radius:3px;background:var(--fill2);overflow:hidden;position:relative}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:3px}
.strip{grid-column:1/-1;display:flex;gap:2px;height:28px;margin-top:4px}
.strip[hidden]{display:none}
.strip button{all:unset;cursor:pointer;height:100%;min-width:6px;position:relative;border-radius:3px}
.strip button:hover,.strip button:focus-visible,.strip button.on{outline:2px solid var(--ink);outline-offset:1px;z-index:1}
.strip span{position:absolute;left:5px;bottom:5px;font-size:10.5px;font-weight:600;white-space:nowrap;overflow:hidden;max-width:calc(100% - 8px)}
.list{list-style:none;margin:0;padding:0}
.list li+li{border-top:.5px solid var(--sep)}
.list button{all:unset;cursor:pointer;box-sizing:border-box;width:100%;display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:3px 10px;align-items:center;padding:9px 0}
.list .no{color:var(--ink3);font-size:13px;font-variant-numeric:tabular-nums}
.list .nm{font-size:14.5px;word-break:keep-all}
.list .vv{font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.list .vv small{color:var(--ink2);font-weight:400;margin-left:4px}
.list .meter{grid-column:2/-1;height:4px}
.seg{display:inline-grid;grid-auto-flow:column;background:var(--fill2);border-radius:9px;padding:2px}
.seg button{all:unset;cursor:pointer;font-size:12.5px;padding:4px 10px;border-radius:7px;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--glass-solid);box-shadow:0 1px 3px rgba(0,0,0,.2);font-weight:600}
.news{list-style:none;margin:0;padding:0}
.news li+li{border-top:.5px solid var(--sep)}
.news button{all:unset;cursor:pointer;display:grid;gap:3px;padding:10px 0;width:100%;box-sizing:border-box}
.news .m{font-size:12px;color:var(--ink2);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.news .tier{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--fill2);color:var(--ink)}
.news .tier.hold{color:var(--warn)}
.news .hd{font-size:14.5px;font-weight:500;word-break:keep-all}
.news .eff{font-size:12.5px;color:var(--ink2)}
.news .eff b{color:var(--hot-ink);font-weight:600}
.news .nb{display:grid;gap:4px;padding:10px 0}
.news a.hd{color:inherit;text-decoration:none}
.news a.hd:hover{text-decoration:underline}
.news .eff .st{color:var(--ink3)}
.news .show{all:unset;cursor:pointer;justify-self:start;color:var(--tint);font-size:12.5px;font-weight:500;margin-top:2px}
.card>.more{all:unset;cursor:pointer;justify-self:start;color:var(--tint);font-size:14px}
.wk{font-size:13px;color:var(--ink2);padding-top:8px;border-top:.5px solid var(--sep)}
.wk b{color:var(--ink);font-weight:600}
.lede.sm{font-size:16px}
.mine .mineb{all:unset;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;box-sizing:border-box}
.mine .nm{display:block;font-family:var(--f-display);font-size:20px;font-weight:700;letter-spacing:-.01em;word-break:keep-all;margin-top:2px}
.mine .sub{color:var(--ink2);font-size:12.5px;word-break:keep-all}
.mine .vv{text-align:right;display:grid;gap:2px}
.mine .vv b{font-size:30px;font-weight:700;color:var(--hot-ink)}
.mine .vv small{color:var(--ink2);font-size:12px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts .btn{background:var(--fill2);color:var(--ink);font-size:13px;padding:7px 14px}
.acts .btn.on{background:var(--hot);color:#fff}
.chips{font-size:12.5px;color:var(--ink2);word-break:keep-all}
.ad .adbox{min-height:90px;display:grid;place-items:center;border:1px dashed var(--sep);border-radius:12px;color:var(--ink3);font-size:13px}
.rule{font-size:12px;color:var(--ink3);margin:0}
/* 직업·업무 카드 */
.place{display:grid;gap:12px}
.place .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.place h2{margin:0;font-family:var(--f-display);font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.2;word-break:keep-all}
.place .sub{color:var(--ink2);font-size:13.5px;word-break:keep-all}
.place .sub.via{font-size:13px}
.place .sub.via b{color:var(--ink);font-weight:600}
.comp{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.comp li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;font-size:13.5px}
.comp li .nm{word-break:keep-all}
.comp li .vv{color:var(--ink2);font-variant-numeric:tabular-nums}
.comp li i{grid-column:1/-1;display:block;height:4px;border-radius:2px;background:var(--fill2);position:relative}
.comp li i{background:linear-gradient(var(--ink3),var(--ink3)) no-repeat left/100% 100%;opacity:.45}
.comp li.more{display:block;color:var(--ink3);font-size:12.5px}
.x{all:unset;cursor:pointer;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--fill2);color:var(--ink2);flex:none}
.split{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--fill2);gap:2px}
.split i{display:block}
.legend2{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2)}
.legend2 span{display:inline-flex;align-items:center;gap:6px}
.legend2 span::before{content:"";width:9px;height:9px;border-radius:2px;background:var(--c)}
.tasks{list-style:none;margin:0;padding:0}
.tasks li+li{border-top:.5px solid var(--sep)}
.tasks button{all:unset;cursor:pointer;box-sizing:border-box;width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:9px 0}
.tasks .nm{font-size:14.5px}
.tasks .meta{font-size:12px;color:var(--ink2)}
.tasks .vv{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.tasks .vv small{color:var(--ink2);font-weight:400}
.tasks .meter{height:4px}
.tasks .meter .f{opacity:.35}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--fill2);margin-left:6px;vertical-align:1px}
.pill.r{color:var(--hot-ink)}.pill.d{outline:1.5px dashed var(--ink2);outline-offset:-1.5px;background:transparent}
.cmp{display:grid;gap:8px}
.cmp .row{display:grid;grid-template-columns:1fr auto;font-size:14px}
.guard{font-size:12px;color:var(--ink2);background:var(--fill);border-radius:10px;padding:9px 11px;margin:0}
details.card summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;font-size:15px;font-weight:600}
details.card summary::-webkit-details-marker{display:none}

{

    const cp=el('div','cmp');const r1=el('div','row');const nm=el('b',null,RJ_[bj].name);r1.append(nm);const xb=el('button','x','✕');xb.type='button';xb.setAttribute('aria-label','비교 해제');xb.onclick=()=>{selB=-1;render();schedule()};r1.append(xb);
    cp.append(r1,el('div',null,`${y4}년 노출도 ${pct(occ(j,y4))}% → ${pct(occ(bj,y4))}% · 겹치는 업무 ${pct(sh.reduce((s,t)=>s+t[2],0)/bw)}%`),el('div','rule',ln.length?'새로 익힐 일: '+ln.map(t=>t[0]).join(', '):'새로 익힐 일 없음'),el('div','rule','지도에서 점선 테두리로 보여요. 교육 기간·비용과 실제 이직 사례는 아직 반영하지 않았어요.'));c.append(cp)}
  else{const s=el('div','search');s.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>';
    const inp=el('input');inp.id='q2';inp.type='search';inp.placeholder='옮겨갈 직업과 비교하기';inp.setAttribute('aria-label','비교할 직업 검색');const res=el('ul','results');res.hidden=true;s.append(inp,res);
    wireSearch(inp,res,k=>{selB=k===j?-1:k;render();schedule()});c.append(s)}
  c.append(el('p','guard','직업 단위의 경향이에요. 개인 평가나 인원 감축의 근거로 쓸 수 없어요.'));return c}
function taskCard(r){
  const c=el('section','card place'),y4=Math.min(yi()+4,2032),v=p(r,year);
  const top=el('div','top'),tt=el('div');tt.append(el('h2',null,RN[r][0]),el('div','sub',`${CAT[r[0]][0]} · ${RN[r][1]} (${r})`));

  const lede=el('p','lede');lede.textContent=`${Math.round(TW[r])}만 명이 하는 일이에요. ${SUB.has(r)?'AI가 이 일을 대신하는 쪽(대체형)':'사람이 AI와 함께 더 하게 되는 쪽(보완형)'}으로 분류했어요.`;
  const bn=el('div','bign');const b=el('b','num');b.append(String(pct(v)),el('small',null,'%'));bn.append(b,el('span',null,`${yi()} ${tag(year)} 노출도 · ${y4}년 ${pct(p(r,y4))}%`));
  c.append(top,lede,bn,trend((y,s)=>p(r,y,s)),el('div','lab',`이 업무를 하는 직업 ${TJ[r].size}개`));
  const ul=el('ul','list');[...TJ[r]].sort((a,b)=>RJ_[b].ws-RJ_[a].ws).forEach((j,i)=>{const t=RJ_[j].tasks.find(t=>t[1]===r),li=el('li'),bt=el('button');bt.type='button';
    const vv=el('span','vv');vv.append(`${pct(t[2]/tw(j))}%`,el('small',null,'비중'));bt.append(el('span','no',i+1),el('span','nm',RJ_[j].name),vv);bt.onclick=()=>pickJob(j);li.appendChild(bt);ul.appendChild(li)});
  c.append(ul,el('p','rule','지도에서 이 업무를 하는 동네만 밝게 남아요.'));return c}

function render(){
  const keep=document.activeElement&&document.activeElement.id;
  ctx.innerHTML='';rest.innerHTML='';
  if(selTask)ctx.appendChild(taskCard(selTask));
  else if(selA>=0)ctx.appendChild(jobCard(selA));

}
function refresh(){render();if(mtype==='cat')renderLegend();schedule()}
let raf=0;function schedule(){if(raf)return;raf=requestAnimationFrame(()=>{raf=0;paint()})}

// ---------- 검색 ----------
const norm=s=>(s||'').replace(/\s/g,'').toLowerCase();
// 세부 직업명 사전: 사람들이 쓰는 이름 → 표준 직업
const ENT=[];RJ_.forEach((j,i)=>{ENT.push({t:j.name,j:i,std:true});if(j.full!==j.name)ENT.push({t:j.full,j:i,std:true});(j.smalls||[]).forEach(([c,n])=>ENT.push({t:n,j:i,std:false,k:c,kn:n,sm:true}));(cm.titles[j.name]||[]).forEach(([t,d])=>ENT.push({t,j:i,std:false,d}))});
// 공식 직업명 사전(한국고용정보원 매핑정보): 직업명 → 한국표준직업분류 세분류 → 지도 표준 직업
let KS={codes:{},titles:[]};try{KS=await (await fetch('ksco_titles.json')).json()}catch(e){}
Object.entries(KS.codes).forEach(([c,[n,j,d]])=>ENT.push({t:n,j,std:false,k:c,kn:n,d,ks:true}));
KS.titles.forEach(([t,c])=>{const v=KS.codes[c];if(v)ENT.push({t,j:v[1],std:false,k:c,kn:v[0],d:v[2]})});
const NT=ENT.length;
function matches(q){q=norm(q);if(!q)return [];const seen=new Set();
  return ENT.map(e=>{const n=norm(e.t);const sc=n===q?0:n.startsWith(q)?1:n.includes(q)?2:(q.length>=2&&q.includes(n)&&n.length>=2)?3:9;return {...e,sc}}).filter(o=>o.sc<9)
    .sort((a,b)=>a.sc-b.sc||(b.std-a.std)||(!!a.k-!!b.k)||a.t.length-b.t.length||RJ_[b.j].ws-RJ_[a.j].ws).filter(o=>{const k=o.t+'|'+o.j;if(seen.has(k))return false;seen.add(k);return true}).slice(0,7)}
function wireSearch(inp,res,onPick){
  const draw=()=>{res.innerHTML='';const m=matches(inp.value);if(!inp.value){res.hidden=true;return}
    if(!m.length){const li=el('li');const d=el('div',null,`아직 사전에 없는 이름이에요. 직업명 ${ENT.length.toLocaleString()}개 중에서 찾고 있어요. 비슷한 말로 찾아보세요.`);d.style.padding='11px 14px';d.style.fontSize='13px';d.style.color='var(--ink2)';li.appendChild(d);res.appendChild(li)}
    m.forEach(e=>{const li=el('li'),b=el('button');b.type='button';const L=el('span',null,e.t);
      const R=el('small',null,e.std?`지역 · 노출도 ${pct(occ(e.j,year))}%`:`→ ${RJ_[e.j].name} · ${pct(occ(e.j,year))}%`);
      b.append(L,R);b.onclick=()=>{inp.value='';res.hidden=true;onPick(e.j,e.std?null:e)};li.appendChild(b);res.appendChild(li)});res.hidden=false};
  inp.addEventListener('input',draw);
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){const m=matches(inp.value);if(m.length){inp.value='';res.hidden=true;onPick(m[0].j,m[0].std?null:m[0])}}if(e.key==='Escape'){inp.value='';res.hidden=true}})}
wireSearch($('#q'),$('#results'),(i,via)=>pickJob(i,via));
['마케터','AE','간호사','개발자','택배기사','공무원'].forEach(n=>{const b=el('button',null,n);b.type='button';b.onclick=()=>{const m=matches(n)[0];if(m)pickJob(m.j,m.std?null:m)};$('#sugg').appendChild(b)});

// ---------- 선택 ----------
const sheet=$('#sheet');
function setDetent(d){if(desk())return;sheet.classList.toggle('half',d==='half');sheet.classList.toggle('full',d==='full');sheet.dataset.d=d||'peek'}
let selVia=null;
function setHash(h){try{history.replaceState(null,'',h?'#'+h:location.pathname+location.search)}catch(e){}}
function pickJob(j,via=null){selVia=via;selA=j;selB=-1;selTask=null;flash=null;refresh();$('#scroll').scrollTop=0;setDetent('half');setHash('j='+RJ_[j].code+(via&&via.t?'&q='+encodeURIComponent(via.t):''))}
function selectTask(r){selTask=selTask===r?null:r;flash=null;refresh();$('#scroll').scrollTop=0;if(selTask)setDetent('half')}

// 휴대폰 시트: 손잡이를 끌거나 눌러 높이 바꾸기
{let sy=null,moved=false;const g=$('#grab');
  g.addEventListener('pointerdown',e=>{sy=e.clientY;moved=false;g.setPointerCapture(e.pointerId)});

{const h=new URLSearchParams(location.hash.slice(1)),c=h.get('j');if(c){const j=jIdx(c);if(j>=0){const q=h.get('q');let via=null;if(q){const m=matches(q).find(e=>e.j===j);via=m&&!m.std?m:{t:q}}pickJob(j,via)}}}

})();
