# AI 소식 갱신: 하루 세 번(08:46·12:46·17:46 KST)과 [Run workflow] 버튼.
# Claude(구독 토큰 CLAUDE_CODE_OAUTH_TOKEN)가 .github/prompts/news.md대로 feed.json만 고치고,
# 이 워크플로가 check_data·guard_commit을 통과한 경우에만 main에 커밋·push한다(Claude는 push하지 않는다).
name: news
on:
  schedule:
    - cron: '46 23,3,8 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
  id-token: write
concurrency: { group: site-writes, cancel-in-progress: false }
jobs:
  news:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - name: Claude가 소식 찾기
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: '.github/prompts/news.md 파일을 읽고 그 지시를 처음부터 끝까지 그대로 수행해.'
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 120
            --allowedTools "Read,Edit,Write,Glob,Grep,WebSearch,WebFetch,Bash(python3 tools/find_dwa.py:*),Bash(python3 tools/check_data.py:*),Bash(python3 -m json.tool:*)"
      - name: 점검·커밋·push
        env: { EXEC: '${{ steps.claude.outputs.execution_file }}' }
        run: |
          git config user.name msgroom76; git config user.email msgroom76@users.noreply.github.com
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then echo "바뀐 것 없음"; exit 0; fi
          msg=$(python3 tools/ci_commit_msg.py "$EXEC" "소식 갱신 $(TZ=Asia/Seoul date +'%Y-%m-%d %H')시")
          python3 tools/check_data.py --feed-only
          python3 tools/guard_commit.py news
          git add -A && git commit -q -m "$msg"
          ok=0; for i in 1 2 3; do if git pull -q --rebase origin main && python3 tools/check_data.py --feed-only >/dev/null && python3 tools/guard_commit.py news && git push -q origin HEAD:main; then ok=1; break; fi; sleep 10; done; [ $ok = 1 ]
      - name: 실패하면 이슈로 알리기
        if: failure()
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh issue create --title "소식 갱신 실패 $(TZ=Asia/Seoul date +'%m-%d %H:%M')" --body "실행 기록: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
