<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}body{width:1200px;height:630px;background:#0b0b0f;color:#f5f5f7;font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;display:grid;grid-template-columns:1fr 430px;overflow:hidden}
.l{padding:64px 0 56px 72px;display:flex;flex-direction:column}
.brand{font-size:15px}
.lk{display:grid;grid-template-columns:auto auto;column-gap:.44em;font-weight:700;width:max-content}
.lk .ai{grid-row:1/3;font-family:Inter,'Helvetica Neue',Arial,sans-serif;font-size:2.9em;line-height:1;letter-spacing:-.04em;margin:-.0893em 0 0 -.05em;align-self:start}
.lk .w{border-bottom:.06em solid currentColor;line-height:1;white-space:nowrap}
.lk .en{font-family:Inter,'Helvetica Neue',Arial,sans-serif;letter-spacing:-.035em;padding:0 .3em .18em 0}
.lk .en+.en{padding-top:.15em}
.lk .ko{grid-column:2;font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;font-size:.794em;letter-spacing:-.04em;padding:.26em 0 .26em}

.grp{margin-top:30px;font-size:24px;color:#a1a1aa}
.nm{margin-top:6px;font-size:58px;font-weight:800;letter-spacing:-.03em;line-height:1.12;word-break:keep-all}
.lede{margin-top:26px;font-size:26px;color:#d4d4d8}
.big{display:flex;align-items:baseline;gap:18px;margin-top:2px}.big b{font-size:132px;font-weight:800;letter-spacing:-.04em;color:#ff8ccd;line-height:1}.big b small{font-size:60px}
.big span{font-size:26px;color:#a1a1aa}
.bar{margin-top:auto;height:12px;border-radius:6px;background:#26262b;position:relative;width:560px}.bar i{position:absolute;left:0;top:0;bottom:0;width:{{W}}%;background:#ff8ccd;border-radius:6px}
.src{margin-top:16px;font-size:17px;color:#71717a}
.r{display:grid;place-items:center;padding:40px 48px 40px 0}.r img{max-width:100%;max-height:540px}
</style></head><body><div class="l"><div class="brand"><div class="lk"><span class="ai">AI</span><span class="w en">Occupied</span><span class="w en">Map</span><span class="w ko">점령 지도</span></div></div><div class="grp">{{GROUP}} · 취업자 {{WS}}만 명</div><div class="nm">{{NAME}}</div>
<div class="lede">사람이 하던 이 일 중 AI가 이미 해낼 수 있는 몫</div><div class="big"><b>{{V}}<small>%</small></b><span>2030년 예측 {{V30}}%</span></div>
<div class="bar"><i></i></div><div class="src">2026 · 노출도 Eloundou 외(2024)·ILO(2025) 평균 · 업무 O*NET · 취업자 국가데이터처</div></div>
<div class="r"><img src="data:image/png;base64,{{MAP}}"></div></body></html>
